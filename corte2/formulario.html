<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact form</title>
</head>
<body>
    <body background="../imagenes/FLOWER BOY.JPEG"></body>
    <h1>Contact form</h1>
    <p>Please fill in your information and we'll be sending your order in no time.</p>

    <form action="#" method="POST">

        <div>
            <label>Your Name</label>
            <input type="text" name="first_name" placeholder="First Name">
            <input type="text" name="last_name" placeholder="Last Name">
        </div>

        <br>

        <div>
            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" placeholder="e.g. hello@contact.net">
        </div>

        <br>

        <div>
            <label>Phone *</label>
            <input type="tel" name="phone_1" placeholder="###" size="3">
            <input type="tel" name="phone_2" placeholder="###" size="3">
            <input type="tel" name="phone_3" placeholder="####" size="4">
        </div>

        <br>

        <div>
            <label for="subject">Message Subject *</label>
            <select id="subject" name="subject">
                <option value="other">Other</option>
            </select>
        </div>

        <br>

        <div>
            <label for="message">Message *</label>
            <textarea id="message" name="message" rows="5" cols="40"></textarea>
        </div>

        <br>


        <div>
            <div>
                <label for="captcha">Verification *</label>
            </div>
            <div style="background-color: #f2f2f2; padding: 10px; border-radius: 5px; width: 200px">
                <input type="checkbox" id="captcha" name="captcha" value="captcha">
                <label for="captcha">I am not a robot</label>
                <img src="../imagenes/captcha.webp" alt="captcha" width="35">
            </div>
        </div>





        <br>

        <button type="submit">SUBMIT FORM</button>

    </form>

</body>
</html>
